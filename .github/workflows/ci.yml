name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Resolve Go module graph
        run: |
          go mod tidy
          echo '--- BEGIN GO.MOD ---'
          cat go.mod
          echo '--- END GO.MOD ---'
          echo '--- BEGIN GO.SUM ---'
          cat go.sum
          echo '--- END GO.SUM ---'
      - run: npm install
      - run: npm run verify
      - run: docker build -t vutame-ci .
